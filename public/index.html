<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>

    <section id="entrada">
      <div>
        <div>
          <form id="form-nom">
            <input id="nom" placeholder="El teu nom" />
            <div id="error-nom"></div>
            <button>Entrar</button>
          </form>
        </div>
      </div>
    </section>
<section id="xat" class="container my-4 d-none" style="max-width: 700px;">

    <body class="bg-light">
        <canvas id="canvas" width="800" height="500" style="border: 1px solid black; cursor: none;"></canvas>
    </section>
        <script src="/socket.io/socket.io.js"></script>
        <script>
        
        const socket = io();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const entrada = document.getElementById('entrada');
        const formNom = document.getElementById('form-nom');
        const inputNom = document.getElementById('nom');
        const errorNom = document.getElementById('error-nom');
        const xat = document.getElementById('xat');

        let click = true;
        let dibujando = false;
        let nom = '';


        canvas.addEventListener('mousemove', (e) => {  
                userCircle(e.offsetX, e.offsetY);
        });
            
        formNom.addEventListener('submit', (e) => {
            e.preventDefault();
            const valor = inputNom.value.trim();

            if (valor.length === 0) {
                errorNom.textContent = 'Escriu un nom';
                return;
            }

            nom = valor;
            socket.emit('registre', nom);

            entrada.classList.add('d-none');
            xat.classList.remove('d-none');
        });
        
        function userCircle(x, y){

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fillStyle = 'red';
            ctx.fill();

            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = 'black';
            ctx.fillText(nom, x, y - 30);
        }

    </script>
</body>
</html>
