<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Canvas</title>
</head>
<body class="bg-light">
    <section id="entrada" class="container mt-5" style="max-width: 400px;">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 text-center mb-3">Canvas col·laboratiu</h1>
          <form id="form-nom">
            <input id="nom" class="form-control" autocomplete="off" placeholder="El teu nom" />
            <div id="error-nom" class="text-danger small mt-1"></div>
            <button class="btn btn-primary w-100 mt-2">Entrar</button>
          </form>
        </div>
      </div>
    </section>
    <section id="xat" class="container my-4 d-none" style="max-width: 700px;">
        <canvas id="canvas" width="800" height="500" style="border: 1px solid black; cursor: none;"></canvas>
        </section>
            <script src="/socket.io/socket.io.js"></script>
            <script>
        
        const socket = io();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const entrada = document.getElementById('entrada');
        const formNom = document.getElementById('form-nom');
        const inputNom = document.getElementById('nom');
        const errorNom = document.getElementById('error-nom');
        const xat = document.getElementById('xat');

        let nom = '';


        canvas.addEventListener('mousemove', (e) => {  
            socket.emit('cursor:move', { x: e.offsetX, y: e.offsetY });
        });
            
        formNom.addEventListener('submit', (e) => {
            e.preventDefault();
            const valor = inputNom.value.trim();

            if (valor.length === 0) {
                errorNom.textContent = 'Escriu un nom';
                return;
            }

            nom = valor;
            socket.emit('registre', nom);

            entrada.classList.add('d-none');
            xat.classList.remove('d-none');
        });
        
        socket.on('cursors', (usuaris) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const id in usuaris) {
                const u = usuaris[id];
                userCircle(u.x, u.y, u.nom, u.color);
            }
        });

        function userCircle(x, y, nomUsuari, color){

            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            const ample = ctx.measureText(nomUsuari).width + 10;
            ctx.fillStyle = 'white';
            ctx.fillRect(x - ample / 2, y - 45, ample, 18);
            ctx.strokeStyle = color;
            ctx.strokeRect(x - ample / 2, y - 45, ample, 18);
            ctx.fillStyle = 'black';
            ctx.fillText(nomUsuari, x, y - 30);
        }

    </script>
</body>
</html>
